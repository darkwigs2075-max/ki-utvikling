<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norgesquiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Norgesquiz</h1>
    <p>Fem spørsmål. Kom deg inn på topp ti.</p>
  </header>
  <main>
    <section id="quiz" aria-live="polite">
      <p id="progress"></p>
      <div class="meter" aria-hidden="true"><span id="meter"></span></div>
      <h2 id="question"></h2>
      <div id="answers"></div>
    </section>

    <section id="finish" hidden>
      <h2>Quizen er ferdig</h2>
      <p id="result"></p>
      <form id="score-form">
        <label for="name">Navn</label>
        <input id="name" maxlength="30" required autocomplete="nickname">
        <button class="primary" type="submit">Lagre resultat</button>
      </form>
      <p id="error" role="alert"></p>
    </section>

    <section id="highscores" hidden>
      <h2>Highscore</h2>
      <ol id="score-list"></ol>
      <button class="primary" id="restart" type="button">Spill på nytt</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
