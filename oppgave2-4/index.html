<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaTok Quiz</title>
  <style>
    :root {
      --bg: #0e0e12;
      --card: #1a1a22;
      --text: #f2f2f5;
      --muted: #9a9aab;
      --accent: #ff2d6f;
      --ok: #1fb86a;
      --bad: #e5484d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a1030 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
    h1 span { color: var(--accent); }
    header p { margin: 6px 0 0; color: var(--muted); }
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }
    .status {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 8px;
    }
    .bar { height: 6px; background: #2c2c38; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .bar div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    h2 { font-size: 1.3rem; margin: 0 0 18px; line-height: 1.35; }
    .options { display: grid; gap: 10px; }
    .option {
      text-align: left;
      font: inherit;
      color: var(--text);
      background: #252531;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .option:hover:not(:disabled) { background: #30303f; }
    .option:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .option:disabled { cursor: default; }
    .option.correct { background: rgba(31, 184, 106, .2); border-color: var(--ok); }
    .option.wrong { background: rgba(229, 72, 77, .2); border-color: var(--bad); }
    .feedback { min-height: 1.6em; margin: 16px 0 0; font-weight: 600; }
    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }
    .btn {
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn:hover { filter: brightness(1.1); }
    .hidden { display: none; }
    #result { text-align: center; }
    #result .score { font-size: 3rem; font-weight: 800; color: var(--accent); margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Media<span>Tok</span> Quiz</h1>
    <p>Crying guy, Griffith, DIO and friends. How cooked is your brain from MediaTok?</p>
  </header>

  <main class="card">
    <section id="quiz">
      <div class="status">
        <span id="progress"></span>
        <span id="score"></span>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <h2 id="question"></h2>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="btn hidden" id="next" type="button">Next question</button>
    </section>

    <section id="result" class="hidden">
      <h2>Quiz complete!</h2>
      <div class="score" id="final-score"></div>
      <p id="final-message"></p>
      <button class="btn" id="restart" type="button">Play again</button>
    </section>
  </main>

  <script>
    const QUESTIONS_PER_ROUND = 10;
    const questions = [];
    const pool = [
      {
        question: "Who is the guy crying, screaming and bleeding in roughly 90% of MediaTok edits?",
        options: ["Rudeus Greyrat", "Subaru Natsuki", "Kazuma Satou", "Naofumi Iwatani", "Light Yagami"],
        answer: 1,
        joke: "Subaru Natsuki, certified crying guy. He has died more times than your phone battery."
      },
      {
        question: "Subaru's superpower in Re:Zero is basically save-scumming with extra pain. What is it called?",
        options: ["Geass", "Return by Death", "Time Stop", "Nen"],
        answer: 1,
        joke: "Return by Death: respawn, but with trauma."
      },
      {
        question: "Which silver-haired half-elf does Subaru fall for in Re:Zero?",
        options: ["Rem", "Beatrice", "Emilia", "Priscilla"],
        answer: 2,
        joke: "Emilia-tan. Yes, the Rem fans are typing angrily right now."
      },
      {
        question: "What was Rudeus Greyrat doing before getting reincarnated in Mushoku Tensei?",
        options: ["Being a 34-year-old NEET", "Being a hero", "Being a chef", "Being a prince"],
        answer: 0,
        joke: "Jobless Reincarnation. The title was not lying."
      },
      {
        question: "Who is Rudeus's blue-haired, hat-wearing first magic teacher?",
        options: ["Eris", "Sylphiette", "Ghislaine", "Roxy Migurdia"],
        answer: 3,
        joke: "Roxy: the reason half of Mushoku Tensei fans have a new profile picture."
      },
      {
        question: "Aladdin from Magi carries a flute and talks to a giant genie living in his bottle. What is the genie's name?",
        options: ["Ifrit", "Ugo", "Baal", "Amon"],
        answer: 1,
        joke: "Ugo! The big blue genie in the bottle. Unfortunately the bottle does not grant wishes."
      },
      {
        question: "Which country does Sinbad rule in Magi?",
        options: ["Kou Empire", "Balbadd", "Sindria", "Reim"],
        answer: 2,
        joke: "Sindria: Sinbad, but make it a nation."
      },
      {
        question: "\"It was too big to be called a sword. It was more like a heap of raw iron.\" Which sword is this?",
        options: ["Excalibur", "Zanpakuto", "Masamune", "Dragonslayer"],
        answer: 3,
        joke: "Guts's Dragonslayer. Compensating for something? No, just fighting demons."
      },
      {
        question: "Which Berserk character is responsible for the most infamous betrayal on MediaTok?",
        options: ["Casca", "Puck", "Griffith", "Judeau", "Zodd"],
        answer: 2,
        joke: "Griffith. Whoever says 'he did nothing wrong' gets blocked immediately."
      },
      {
        question: "Which JoJo villain screams \"WRYYYYY!\" and \"ZA WARUDO!\"?",
        options: ["Kars", "Kira Yoshikage", "DIO", "Diavolo", "Pucci"],
        answer: 2,
        joke: "DIO. Yes, he did throw a road roller at you. No, you cannot dodge it."
      },
      {
        question: "What does Kira Yoshikage want most in JoJo's Bizarre Adventure?",
        options: ["World domination", "Immortality", "A quiet life", "A girlfriend", "Hamon training"],
        answer: 2,
        joke: "A quiet life. He is just a regular guy who is a bit too into hands."
      },
      {
        question: "Which is Thorfinn's famous line after he finally grows up in Vinland Saga?",
        options: ["\"Believe it!\"", "\"I have no enemies.\"", "\"Plus Ultra!\"", "\"I'll be King of the Pirates!\""],
        answer: 1,
        joke: "I have no enemies. Peak character development, from edgy kid to ultimate chad."
      },
      {
        question: "Which studio animated Vinland Saga Season 2?",
        options: ["Ufotable", "Bones", "Madhouse", "MAPPA", "Wit Studio"],
        answer: 3,
        joke: "MAPPA. They have not slept since 2018."
      },
      {
        question: "Complete the meme: \"I'll take a potato chip... and ___\"",
        options: ["throw it", "share it", "EAT IT", "write your name in it"],
        answer: 2,
        joke: "EAT IT! Light Yagami, the only man who can make snacks dramatic."
      },
      {
        question: "What does Eren's famous \"Tatakae!\" mean in Attack on Titan?",
        options: ["Run away", "Go to sleep", "Eat dinner", "Fight!"],
        answer: 3,
        joke: "Fight! Eren's answer to literally every problem."
      },
      {
        question: "What do MediaTok comment sections argue about all day?",
        options: [
          "Which anime or manga is the greatest media ever made",
          "Cooking tutorials",
          "Dance challenges",
          "Cryptocurrency advice"
        ],
        answer: 0,
        joke: "And somebody will always comment 'Berserk'. Every. Single. Time."
      }
    ];

    const finalQuestion = {
      question: "Final question: who is the best written character of them all?",
      options: ["Guts (Berserk)", "Subaru Natsuki (Re:Zero)", "Thorfinn (Vinland Saga)", "Aladdin (Magi)", "Rudeus Greyrat (Mushoku Tensei)"],
      allCorrect: true,
      joke: "Every answer is correct. Do not argue in the comments."
    };

    function startRound() {
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      questions.length = 0;
      questions.push(...shuffled.slice(0, QUESTIONS_PER_ROUND - 1), finalQuestion);
      current = 0;
      score = 0;
      showQuestion();
    }

    const $ = (id) => document.getElementById(id);
    let current = 0;
    let score = 0;
    let answered = false;

    function showQuestion() {
      const q = questions[current];
      answered = false;
      $("progress").textContent = `Question ${current + 1}/${questions.length}`;
      $("score").textContent = `Score: ${score}`;
      $("bar").style.width = `${(current / questions.length) * 100}%`;
      $("question").textContent = q.question;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("next").classList.add("hidden");

      const box = $("options");
      box.innerHTML = "";
      q.options.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = text;
        btn.addEventListener("click", () => choose(i));
        box.appendChild(btn);
      });
    }

    function choose(i) {
      if (answered) return;
      answered = true;
      const q = questions[current];
      const buttons = $("options").children;
      for (const b of buttons) b.disabled = true;

      if (q.allCorrect) {
        for (const b of buttons) b.classList.add("correct");
        score++;
        $("feedback").textContent = `✅ Correct! ${q.joke}`;
        $("feedback").classList.add("ok");
        $("score").textContent = `Score: ${score}`;
        $("next").textContent = "See result";
        $("next").classList.remove("hidden");
        $("next").focus();
        return;
      }
      buttons[q.answer].classList.add("correct");

      if (i === q.answer) {
        score++;
        $("feedback").textContent = `✅ Correct! ${q.joke}`;
        $("feedback").classList.add("ok");
      } else {
        buttons[i].classList.add("wrong");
        $("feedback").textContent = `❌ Wrong! The answer is ${q.options[q.answer]}. ${q.joke}`;
        $("feedback").classList.add("bad");
      }
      $("score").textContent = `Score: ${score}`;
      $("next").textContent = current === questions.length - 1 ? "See result" : "Next question";
      $("next").classList.remove("hidden");
      $("next").focus();
    }

    function showResult() {
      $("quiz").classList.add("hidden");
      $("result").classList.remove("hidden");
      $("final-score").textContent = `${score} / ${questions.length}`;
      let msg;
      if (score === questions.length) msg = "Perfect! You are 100% chronically on MediaTok. Please go outside.";
      else if (score >= 7) msg = "Great! You have definitely typed 'Berserk' in a comment section.";
      else if (score >= 4) msg = "Mid. Subaru has died fewer times than you have lost questions.";
      else msg = "Return by Death activated. Go read some manga and try again.";
      $("final-message").textContent = msg;
    }

    $("next").addEventListener("click", () => {
      current++;
      if (current < questions.length) showQuestion();
      else showResult();
    });

    $("restart").addEventListener("click", () => {
      $("result").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      startRound();
    });

    startRound();
  </script>
</body>
</html>
