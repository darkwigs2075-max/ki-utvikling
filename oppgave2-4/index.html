<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABA Quiz - Anime Battle Arena</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef1f7;
      color: #1b2233;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }
    .wrap { width: 100%; max-width: 760px; }
    header { text-align: center; margin-bottom: 18px; }
    header h1 { margin: 0; font-size: 2rem; }
    header p { margin: 4px 0 0; color: #5a6480; }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(20, 30, 60, .12);
    }
    .meta { display: flex; justify-content: space-between; font-weight: 600; color: #5a6480; margin-bottom: 8px; }
    .progress { height: 8px; background: #e3e7f1; border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
    .progress div { height: 100%; width: 0; background: #3b6cf6; transition: width .3s; }
    h2 { margin: 0 0 18px; font-size: 1.4rem; line-height: 1.35; }
    .options { display: grid; gap: 10px; }
    .options.chars { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .option {
      font: inherit;
      text-align: left;
      padding: 14px 16px;
      border: 2px solid #d5dbea;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .option:hover:not(:disabled) { border-color: #3b6cf6; background: #f3f6ff; }
    .option:disabled { cursor: default; }
    .option.correct { border-color: #1f9d55; background: #e5f7ec; }
    .option.wrong { border-color: #d64545; background: #fdeaea; }
    .chars .option { text-align: center; padding: 10px; }
    .portrait {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      background: #dfe5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 700;
      color: #7d8aad;
      object-fit: cover;
      object-position: top;
      margin-bottom: 8px;
    }
    .name { font-weight: 600; }
    .feedback { min-height: 1.6em; margin: 16px 0 0; font-weight: 700; }
    .feedback.ok { color: #1f9d55; }
    .feedback.bad { color: #d64545; }
    .btn {
      font: inherit;
      font-weight: 700;
      margin-top: 14px;
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #3b6cf6;
      color: #fff;
      cursor: pointer;
    }
    .btn:hover { background: #2d58d4; }
    .hidden { display: none; }
    #result { text-align: center; }
    .big { font-size: 3rem; font-weight: 800; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ABA Quiz</h1>
      <p>How well do you know Anime Battle Arena?</p>
    </header>

    <div class="card" id="quiz">
      <div class="meta"><span id="progress"></span><span id="score"></span></div>
      <div class="progress"><div id="bar"></div></div>
      <h2 id="question"></h2>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="btn hidden" id="next" type="button">Next</button>
    </div>

    <div class="card hidden" id="result">
      <p>Your result</p>
      <div class="big" id="final-score"></div>
      <h2 id="title"></h2>
      <p id="final-message"></p>
      <button class="btn" id="restart" type="button">Play again</button>
    </div>
  </div>

  <script>
    const QUESTIONS_PER_ROUND = 10;
    const questions = [];

    // The first option is always the correct one (options are shuffled on load).
    // chars: true shows the options as character portraits.
    const pool = [
      { question: "Who's the humble Z tier?", chars: true,
        options: ["Yoruichi", "Might Guy", "Akainu", "Lancer", "Bam"] },
      { question: "Might Guy, Akainu, Lancer, Bam and Yoruichi all queue up in the same lobby. Which one is the humble Z tier?", chars: true,
        options: ["Yoruichi", "Might Guy", "Akainu", "Lancer", "Bam"] },
      { question: "The tier list says SS, S, A, B, C... and then comes the humble Z tier. Who is the only one standing there?", chars: true,
        options: ["Yoruichi", "Might Guy", "Akainu", "Lancer", "Bam"] },
      { question: "Who's the humble C tier: the green teacher who is basically the dad of the whole show?", chars: true,
        options: ["Piccolo", "Gaara", "Enel", "Trafalgar Law", "Tanjiro Kamado"] },
      { question: "Humble C tier: which man calls himself a god and lives in the clouds?", chars: true,
        options: ["Enel", "Piccolo", "Gaara", "Trafalgar Law", "Sukuna"] },
      { question: "Humble C tier: which tired-looking sand user has the best dark circles in anime?", chars: true,
        options: ["Gaara", "Enel", "Piccolo", "Tanjiro Kamado", "Sukuna"] },
      { question: "Which pirate surgeon creates a 'Room' and cuts you into pieces without you noticing?", chars: true,
        options: ["Trafalgar Law", "Enel", "Gaara", "Piccolo", "Sukuna"] },
      { question: "Yuji Itadori swallowed something very dangerous and now has a roommate. Who is it?", chars: true,
        options: ["Sukuna", "Gaara", "Enel", "Trafalgar Law", "Piccolo"] },
      { question: "Someone is spamming M1 combos on you for 40 seconds. Which key blocks in ABA?",
        options: ["F", "Alt+F4", "Ctrl+Z", "Escape", "Just praying"] },
      { question: "Which key do you press to dodge in ABA, right before you forget it exists and get hit anyway?",
        options: ["Q", "Alt+Tab", "Ctrl+W", "Delete", "Skill issue"] },
      { question: "Which key transforms you in ABA so you can scream like a main character?",
        options: ["G", "Caps Lock", "Alt+F4", "Escape", "Ctrl+Z"] },
      { question: "Which key makes you sprint in ABA so you can run away from the fight you started?",
        options: ["Shift", "Tab", "Caps Lock", "Enter", "Alt"] },
      { question: "Keys 1 to 4 are your special moves, and you will forget half of them mid-fight. How many specials is that?",
        options: ["Four", "Forty", "One", "Zero", "Seven"] },
      { question: "You press Space and Mouse1 together and launch an attack from the air. What is it called?",
        options: ["An aerial attack", "A dance", "A tax return", "A lag spike", "A prayer"] },
      { question: "ABA is where grown adults argue about movesets. On which platform does it live?",
        options: ["Roblox", "Minecraft", "Fortnite", "Nintendo Switch only", "Your fridge"] },
      { question: "ABA has more updates than your sleep schedule. Which studio develops it?",
        options: ["Dogs Studios: South", "Cats Studios: North", "Birds Inc.", "Hamster Games", "Fish Corp."] },
      { question: "ABA has a huge roster and you still pick the same character every single game. Roughly how many characters are there?",
        options: ["Over 125", "Exactly 3", "About 12", "Over 5,000"] },
      { question: "You enter Ranked mode in ABA. What happens to your calm, friendly personality?",
        options: ["It disappears instantly", "It gets stronger", "Nothing, you are a monk", "It transforms into a golden retriever"] },
      { question: "After losing a 1v1, someone in chat types 'it was just lag'. What does that actually mean?",
        options: ["They lost", "Their Wi-Fi is truly cursed", "The server is on fire", "Mercury is in retrograde"] },
      { question: "Gojo shows up in ABA with a blindfold and way too much confidence. Which anime is he from?",
        options: ["Jujutsu Kaisen", "Naruto", "Bleach", "Black Clover", "Hunter x Hunter"] },
      { question: "Krillin has been bald since forever and ABA kept the tradition. Which anime is he from?",
        options: ["Dragon Ball", "One Piece", "Bleach", "Naruto", "JoJo"] },
      { question: "Kakashi copied a thousand jutsu and still arrives late to every single fight. Which anime is he from?",
        options: ["Naruto", "Bleach", "One Piece", "Dragon Ball", "Black Clover"] },
      { question: "Shanks is a One Piece legend who is also missing a body part. Which one?",
        options: ["His left arm", "His right leg", "Both eyebrows", "His hat", "His sense of humor"] },
      { question: "Big Mom will eat your whole team and then ask where the dessert is. Which anime is she from?",
        options: ["One Piece", "Naruto", "Bleach", "JoJo", "Dragon Ball"] },
      { question: "Whitebeard punches the air and the air breaks. What is his power called?",
        options: ["The Quake-Quake Fruit", "The Rubber Fruit", "The Flame-Flame Fruit", "The Ice-Ice Fruit", "Strong vibes only"] },
      { question: "Ichigo has a Bankai and a very angry hairstyle. Which anime is he from?",
        options: ["Bleach", "Naruto", "One Piece", "Black Clover", "Jujutsu Kaisen"] },
      { question: "Accelerator redirects anything that touches him, including your feelings. What is his power?",
        options: ["Vector manipulation", "Water bending", "Sneezing", "Hamon", "Nen"] },
      { question: "Asta has zero magic in a world full of magic and still wins by screaming. Which anime is he from?",
        options: ["Black Clover", "Naruto", "Bleach", "Fairy Tail", "Dr. Stone"] },
      { question: "Jolyne Cujoh fights with string powers and impeccable hairdresser energy. What is her Stand called?",
        options: ["Stone Free", "Star Platinum", "The World", "Killer Queen", "Gold Experience"] },
      { question: "Joseph Joestar from Stardust Crusaders is shocked at least 40 times per episode. What does he scream?",
        options: ["\"Oh my god!\"", "\"Believe it!\"", "\"Plus Ultra!\"", "\"Yare yare daze.\"", "\"Skibidi.\""] }
    ];

    const finalQuestion = {
      question: "FINAL BOSS: who is the best character in ABA?", chars: true,
      options: ["Gojo", "Kakashi", "Ichigo", "Shanks", "Yuji Itadori"],
      allCorrect: true
    };

    // Search terms used to look up portraits on AniList when the display name is ambiguous.
    const SEARCH = {
      "Yoruichi": "Yoruichi Shihouin", "Might Guy": "Might Guy", "Akainu": "Sakazuki",
      "Lancer": "Cu Chulainn", "Bam": "Twenty-Fifth Bam", "Gojo": "Satoru Gojo",
      "Kakashi": "Kakashi Hatake", "Ichigo": "Ichigo Kurosaki", "Shanks": "Shanks",
      "Yuji Itadori": "Yuji Itadori", "Tanjiro Kamado": "Tanjiro Kamado"
    };
    const IMG_KEY = "aba-images";
    let images = {};
    try { images = JSON.parse(localStorage.getItem(IMG_KEY)) || {}; } catch (e) {}

    const SEEN_KEY = "aba-seen";
    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const $ = (id) => document.getElementById(id);
    let current = 0;
    let score = 0;
    let answered = false;

    function prepare(q) {
      const options = shuffle(q.options.map((text, i) => ({ text, correct: i === 0 })));
      return { ...q, options: options.map((o) => o.text), answer: options.findIndex((o) => o.correct) };
    }

    function pickQuestions(count) {
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) {}
      let fresh = pool.filter((q) => !seen.includes(q.question));
      if (fresh.length < count) {
        seen = [];
        fresh = pool;
      }
      const picked = shuffle(fresh).slice(0, count);
      try {
        localStorage.setItem(SEEN_KEY, JSON.stringify(seen.concat(picked.map((q) => q.question))));
      } catch (e) {}
      return picked.map(prepare);
    }

    async function loadImages(names) {
      const missing = names.filter((n) => !images[n]);
      if (!missing.length) return;
      const body = "{" + missing.map((n, i) =>
        `a${i}:Character(search:${JSON.stringify(SEARCH[n] || n)}){image{large}}`).join(" ") + "}";
      try {
        const res = await fetch("https://graphql.anilist.co", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: body })
        });
        const data = (await res.json()).data || {};
        missing.forEach((n, i) => {
          const url = data[`a${i}`] && data[`a${i}`].image && data[`a${i}`].image.large;
          if (url) images[n] = url;
        });
        localStorage.setItem(IMG_KEY, JSON.stringify(images));
      } catch (e) {}
    }

    function portrait(name) {
      if (images[name]) {
        const img = document.createElement("img");
        img.className = "portrait";
        img.src = images[name];
        img.alt = name;
        img.referrerPolicy = "no-referrer";
        return img;
      }
      const div = document.createElement("div");
      div.className = "portrait";
      div.textContent = name[0];
      return div;
    }

    function startRound() {
      questions.length = 0;
      questions.push(...pickQuestions(QUESTIONS_PER_ROUND - 1), prepare(finalQuestion));
      questions[questions.length - 1].answer = 0;
      current = 0;
      score = 0;
      showQuestion();
    }

    async function showQuestion() {
      const q = questions[current];
      answered = false;
      $("progress").textContent = `Question ${current + 1}/${questions.length}`;
      $("score").textContent = `Score: ${score}`;
      $("bar").style.width = `${(current / questions.length) * 100}%`;
      $("question").textContent = q.question;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("next").classList.add("hidden");
      if (q.chars) await loadImages(q.options);
      if (questions[current] !== q) return;
      renderOptions(q);
    }

    function renderOptions(q) {
      const box = $("options");
      box.innerHTML = "";
      box.className = q.chars ? "options chars" : "options";
      q.options.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        if (q.chars) {
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = text;
          btn.append(portrait(text), name);
        } else {
          btn.textContent = text;
        }
        btn.addEventListener("click", () => choose(i));
        box.appendChild(btn);
      });
    }

    function choose(i) {
      if (answered) return;
      answered = true;
      const q = questions[current];
      const buttons = $("options").children;
      for (const b of buttons) b.disabled = true;

      if (q.allCorrect) {
        for (const b of buttons) b.classList.add("correct");
        score++;
        $("feedback").textContent = "✅ Every answer is correct. Do not argue.";
        $("feedback").classList.add("ok");
      } else {
        buttons[q.answer].classList.add("correct");
        if (i === q.answer) {
          score++;
          $("feedback").textContent = "✅ Correct!";
          $("feedback").classList.add("ok");
        } else {
          buttons[i].classList.add("wrong");
          $("feedback").textContent = `❌ Wrong! The answer is: ${q.options[q.answer]}`;
          $("feedback").classList.add("bad");
        }
      }
      $("score").textContent = `Score: ${score}`;
      $("next").textContent = current === questions.length - 1 ? "See result" : "Next question";
      $("next").classList.remove("hidden");
      $("next").focus();
    }

    function showResult() {
      $("quiz").classList.add("hidden");
      $("result").classList.remove("hidden");
      $("final-score").textContent = `${score} / ${questions.length}`;
      let title, msg;
      if (score === questions.length) {
        title = "Ranked Legend";
        msg = "Perfect. You are chronically online in ABA. Please go outside.";
      } else if (score >= 7) {
        title = "Certified Lobby Warrior";
        msg = "You have definitely typed 'it was just lag' after a loss.";
      } else if (score >= 4) {
        title = "Casual Arena Enjoyer";
        msg = "Mid, but with potential. Learn your dodge key.";
      } else {
        title = "NPC in Training";
        msg = "You got comboed for 40 seconds. Press F to block, then queue again.";
      }
      $("title").textContent = title;
      $("final-message").textContent = msg;
    }

    $("next").addEventListener("click", () => {
      current++;
      if (current < questions.length) showQuestion();
      else showResult();
    });

    $("restart").addEventListener("click", () => {
      $("result").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      startRound();
    });

    startRound();
  </script>
</body>
</html>
