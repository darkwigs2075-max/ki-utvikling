<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaTok Quiz</title>
  <style>
    :root {
      --bg: #0e0e12;
      --card: #1a1a22;
      --text: #f2f2f5;
      --muted: #9a9aab;
      --accent: #ff2d6f;
      --ok: #1fb86a;
      --bad: #e5484d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a1030 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
    h1 span { color: var(--accent); }
    header p { margin: 6px 0 0; color: var(--muted); }
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }
    .status {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 8px;
    }
    .bar { height: 6px; background: #2c2c38; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .bar div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    h2 { font-size: 1.3rem; margin: 0 0 18px; line-height: 1.35; }
    .options { display: grid; gap: 10px; }
    .option {
      text-align: left;
      font: inherit;
      color: var(--text);
      background: #252531;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .option:hover:not(:disabled) { background: #30303f; }
    .option:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .option:disabled { cursor: default; }
    .option.correct { background: rgba(31, 184, 106, .2); border-color: var(--ok); }
    .option.wrong { background: rgba(229, 72, 77, .2); border-color: var(--bad); }
    .feedback { min-height: 1.6em; margin: 16px 0 0; font-weight: 600; }
    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }
    .btn {
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn:hover { filter: brightness(1.1); }
    .hidden { display: none; }
    #result { text-align: center; }
    #result .score { font-size: 3rem; font-weight: 800; color: var(--accent); margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Media<span>Tok</span> Quiz</h1>
    <p>Crying guy, Griffith, DIO and friends. How cooked is your brain from MediaTok?</p>
  </header>

  <main class="card">
    <section id="quiz">
      <div class="status">
        <span id="progress"></span>
        <span id="score"></span>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <h2 id="question"></h2>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="btn hidden" id="next" type="button">Next question</button>
    </section>

    <section id="result" class="hidden">
      <h2>Quiz complete!</h2>
      <div class="score" id="final-score"></div>
      <p id="final-message"></p>
      <button class="btn" id="restart" type="button">Play again</button>
    </section>
  </main>

  <script>
    const QUESTIONS_PER_ROUND = 10;
    const questions = [];
    const pool = [
      {
        question: "Subaru Natsuki has been spotted crying, screaming and bleeding in your feed again. What is his job in Re:Zero?",
        options: ["Professional respawner with severe emotional damage", "Part-time hero, full-time hostage", "Accountant at the Royal Guard", "Mascot of the Capital", "Substitute teacher"],
        answer: 0,
        joke: "Subaru dies, cries, retries. It is basically his entire personality and your entire FYP."
      },
      {
        question: "What was Subaru wearing when he got randomly teleported to another world?",
        options: ["A tracksuit, because he just wanted snacks", "Full plate armor", "A wizard robe", "A suit and tie", "A swimsuit"],
        answer: 0,
        joke: "He literally left the house for a convenience store run and came back as the protagonist of a tragedy."
      },
      {
        question: "Rem or Ram? The twin maids in Re:Zero have started more wars online than any real empire. What exactly are they?",
        options: ["Twin oni maids", "Twin pirates", "Twin dragons", "Twin accountants"],
        answer: 0,
        joke: "Pick a side. There is no neutral zone. Do not say 'Emilia' in the comments."
      },
      {
        question: "Which tiny girl in Re:Zero ends her sentences with 'kashira' like it is a legal requirement?",
        options: ["Beatrice", "Emilia", "Rem", "Priscilla", "Your mom"],
        answer: 0,
        joke: "Betty. She has said it for about 400 years and refuses to stop."
      },
      {
        question: "Rudeus Greyrat gets a second chance at life in Mushoku Tensei. What was his life before?",
        options: ["A 34-year-old NEET who got kicked out", "A famous knight", "The prince of a small country", "A professional chef", "A very tired cat"],
        answer: 0,
        joke: "The title is literally 'Jobless Reincarnation'. The show is very upfront about this."
      },
      {
        question: "Who is the blue-haired, hat-wearing mage who changed Rudeus's life and half of MediaTok's profile pictures?",
        options: ["Roxy Migurdia", "Eris", "Sylphiette", "Ghislaine", "Gandalf"],
        answer: 0,
        joke: "Roxy. All hail Roxy. She is the reason half the fandom does not sleep."
      },
      {
        question: "How would you describe Eris Boreas Greyrat in a dating profile?",
        options: ["Fierce tsundere who punches first and talks later", "Gentle pacifist who loves tea", "Introvert who likes quiet libraries", "Corporate lawyer", "Sleepy turtle"],
        answer: 0,
        joke: "Her love language is violence. Rudeus has taken so many hits."
      },
      {
        question: "In Magi, Aladdin carries a bottle with a giant genie inside. What is the genie's name?",
        options: ["Ugo", "Ifrit", "Genie Jr.", "Bob", "Baal"],
        answer: 0,
        joke: "Ugo! Sadly the bottle does not grant wishes, only emotional damage."
      },
      {
        question: "What was Alibaba Saluja's big dream when he first met Aladdin in Magi?",
        options: ["Conquer a dungeon and get rich", "Become a baker", "Become the Hokage", "Sell flutes at the market", "Become a professional napper"],
        answer: 0,
        joke: "Dungeon, treasure, profit. A solid business plan, honestly."
      },
      {
        question: "Which country does Sinbad rule in Magi, while collecting everyone like Pokemon?",
        options: ["Sindria", "Balbadd", "Kou Empire", "Reim", "Sinbadland"],
        answer: 0,
        joke: "Sindria. Sinbad, but make it a nation."
      },
      {
        question: "\"It was too big to be called a sword. It was more like a heap of raw iron.\" Which sword is Guts compensating with?",
        options: ["The Dragonslayer", "A large baguette", "Excalibur", "Zanpakuto", "A very big spoon"],
        answer: 0,
        joke: "Dragonslayer. Guts does not compensate, he just fights demons with construction equipment."
      },
      {
        question: "Which Berserk character is the main reason 'he did nothing wrong' is banned in several comment sections?",
        options: ["Griffith", "Puck", "Casca", "Judeau", "Gandalf"],
        answer: 0,
        joke: "Griffith. If you defend him you owe everyone an apology."
      },
      {
        question: "What exactly is Puck in Berserk, besides the only emotional support in the series?",
        options: ["A tiny elf", "A dragon", "A pig", "A cat", "A very small knight"],
        answer: 0,
        joke: "A tiny elf. He is the only comic relief in the whole series and it still hurts."
      },
      {
        question: "What is hidden in Guts's fake arm because swords were not enough?",
        options: ["A cannon", "A laser pointer", "A grappling hook", "A smaller sword", "A phone charger"],
        answer: 0,
        joke: "A cannon. Guts is a swordsman, a gunman and also a hand-cannon man."
      },
      {
        question: "Griffith's mercenary group has a very cool name and a very cursed HR department. What is it called?",
        options: ["Band of the Hawk", "Band of the Wolf", "Team Rocket", "The Straw Hats", "Hawk Tuah Mercenaries"],
        answer: 0,
        joke: "Band of the Hawk. Great branding, terrible retirement plan."
      },
      {
        question: "DIO throws a road roller at you and screams. What is the correct amount of Rs in his scream?",
        options: ["As many as his lungs allow: WRYYYYY", "Two: WRY", "Zero: he is quiet", "He just coughs", "One: Wr"],
        answer: 0,
        joke: "WRYYYYYY. Also ZA WARUDO. Also you cannot dodge it."
      },
      {
        question: "Jotaro Kujo says one sentence ten times per episode. Which one?",
        options: ["\"Yare yare daze.\"", "\"Believe it!\"", "\"Nani?!\"", "\"I am the bone of my sword.\"", "\"Skibidi.\""],
        answer: 0,
        joke: "Yare yare daze: 'Good grief.' Your Monday summarized in three words."
      },
      {
        question: "What is Kira Yoshikage's ultimate dream in JoJo?",
        options: ["A quiet life", "World domination", "Immortality", "Hamon training", "Winning the lottery"],
        answer: 0,
        joke: "A quiet life. He is just a regular guy who is a bit too into hands."
      },
      {
        question: "Giorno Giovanna has a very normal dream in Golden Wind. What is it?",
        options: ["Become a Gang-Star", "Become a baker", "Become a doctor", "Find a quiet life", "Become a hairdresser"],
        answer: 0,
        joke: "Totally normal career goal. His hairstyle is also totally normal."
      },
      {
        question: "How do JoJo characters spend a quiet moment?",
        options: ["Striking impossible poses", "Taking notes", "Doing taxes", "Sitting and reading", "Meditating"],
        answer: 0,
        joke: "Impossible poses. Spines not included."
      },
      {
        question: "Thorfinn's most famous line after he grows up in Vinland Saga is...",
        options: ["\"I have no enemies.\"", "\"Believe it!\"", "\"Plus Ultra!\"", "\"I'll be King of the Pirates!\"", "\"Where is my sword?\""],
        answer: 0,
        joke: "Peak character development. He went from edgy kid to ultimate chad."
      },
      {
        question: "What does Thorkell the Tall want most in Vinland Saga?",
        options: ["A good fight", "A quiet farm", "A big treasure", "A new boat", "A nap"],
        answer: 0,
        joke: "A good fight. He is a walking boss battle."
      },
      {
        question: "Which Vinland Saga arc makes grown men cry over crops?",
        options: ["The farm arc", "The beach episode", "The tournament arc", "The filler arc"],
        answer: 0,
        joke: "The farm arc. Yes, you will cry over wheat. No, you will not recover."
      },
      {
        question: "Which studio animated Vinland Saga Season 2 and has not slept since 2018?",
        options: ["MAPPA", "Ufotable", "Bones", "Madhouse", "Wit Studio"],
        answer: 0,
        joke: "MAPPA. Send help, they need sleep."
      },
      {
        question: "Complete the meme: \"I'll take a potato chip... and ___\"",
        options: ["EAT IT", "throw it", "share it", "write your name on it"],
        answer: 0,
        joke: "EAT IT! Light Yagami, the only man who can make snacks dramatic."
      },
      {
        question: "What does the Shinigami Ryuk love most, despite being a god of death?",
        options: ["Apples", "Tacos", "Ramen", "Pizza", "Souls"],
        answer: 0,
        joke: "Apples. A god of death with a fruit habit."
      },
      {
        question: "What does the genius detective L eat nonstop while solving crime?",
        options: ["Sweets and cake", "Salad", "Plain rice", "Nothing"],
        answer: 0,
        joke: "Sweets. Genius brain, cursed posture, no regrets."
      },
      {
        question: "What does Eren scream when he is out of ideas in Attack on Titan?",
        options: ["\"Tatakae!\" (Fight!)", "\"Run away!\"", "\"Eat dinner!\"", "\"Nap time!\"", "\"Let us negotiate!\""],
        answer: 0,
        joke: "Fight! His answer to every problem since episode one."
      },
      {
        question: "Sasha Blouse made history in Attack on Titan by stealing and eating what?",
        options: ["A potato", "A pizza", "A steak", "Sushi", "Armin"],
        answer: 0,
        joke: "A potato. Potato girl will live forever in our hearts."
      },
      {
        question: "What does Luffy love more than almost anything, besides his crew?",
        options: ["Meat", "Sleep", "Money", "Sushi", "Salad"],
        answer: 0,
        joke: "Meat. Pirate King energy runs on pure protein."
      },
      {
        question: "What is the famous 'Naruto run'?",
        options: ["Running with your arms stretched out behind you", "Running backwards", "Running on all fours", "Running in circles", "Running to the fridge"],
        answer: 0,
        joke: "Arms behind you. Perfect for raiding Area 51."
      },
      {
        question: "What does every Dragon Ball Z character do for twelve episodes before a fight?",
        options: ["Scream and power up", "Do paperwork", "Negotiate peacefully", "Go shopping", "Take a nap"],
        answer: 0,
        joke: "Scream and power up. The fight then takes four minutes."
      },
      {
        question: "Someone posts a sad edit of a tragic character with piano music. What do you comment?",
        options: ["\"Peak fiction.\"", "\"Nice weather today.\"", "\"Subscribe to my channel.\"", "\"First!\"", "\"Skibidi.\""],
        answer: 0,
        joke: "Peak fiction. It is the law of MediaTok."
      },
      {
        question: "Someone says their favourite anime is mid. What is the correct reaction?",
        options: ["Write 14 paragraphs in all caps", "Nod politely", "Agree and move on", "Ignore it", "Block them instantly"],
        answer: 0,
        joke: "14 paragraphs, all caps, twelve emojis. This is the way."
      },
      {
        question: "What do MediaTok comment sections debate all day, every day?",
        options: ["Which anime or manga is the greatest media ever made", "Cooking tutorials", "Dance challenges", "Cryptocurrency advice", "The weather"],
        answer: 0,
        joke: "And somebody will always comment 'Berserk'. Every. Single. Time."
      }
    ];

    const finalQuestion = {
      question: "Final question: who is the best written character of them all?",
      options: ["Guts (Berserk)", "Subaru Natsuki (Re:Zero)", "Thorfinn (Vinland Saga)", "Aladdin (Magi)", "Rudeus Greyrat (Mushoku Tensei)"],
      allCorrect: true,
      joke: "Every answer is correct. Do not argue in the comments."
    };

    const SEEN_KEY = "mediatok-seen";
    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

    function pickQuestions(count) {
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) {}
      let fresh = pool.filter((q) => !seen.includes(q.question));
      if (fresh.length < count) {
        seen = [];
        fresh = pool;
      }
      const picked = shuffle(fresh).slice(0, count);
      try {
        localStorage.setItem(SEEN_KEY, JSON.stringify(seen.concat(picked.map((q) => q.question))));
      } catch (e) {}
      return picked.map((q) => {
        const options = shuffle(q.options.map((text, i) => ({ text, correct: i === q.answer })));
        return { ...q, options: options.map((o) => o.text), answer: options.findIndex((o) => o.correct) };
      });
    }

    function startRound() {
      questions.length = 0;
      questions.push(...pickQuestions(QUESTIONS_PER_ROUND - 1), finalQuestion);
      current = 0;
      score = 0;
      showQuestion();
    }

    const $ = (id) => document.getElementById(id);
    let current = 0;
    let score = 0;
    let answered = false;

    function showQuestion() {
      const q = questions[current];
      answered = false;
      $("progress").textContent = `Question ${current + 1}/${questions.length}`;
      $("score").textContent = `Score: ${score}`;
      $("bar").style.width = `${(current / questions.length) * 100}%`;
      $("question").textContent = q.question;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("next").classList.add("hidden");

      const box = $("options");
      box.innerHTML = "";
      q.options.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = text;
        btn.addEventListener("click", () => choose(i));
        box.appendChild(btn);
      });
    }

    function choose(i) {
      if (answered) return;
      answered = true;
      const q = questions[current];
      const buttons = $("options").children;
      for (const b of buttons) b.disabled = true;

      if (q.allCorrect) {
        for (const b of buttons) b.classList.add("correct");
        score++;
        $("feedback").textContent = `✅ Correct! ${q.joke}`;
        $("feedback").classList.add("ok");
      } else {
        buttons[q.answer].classList.add("correct");
        if (i === q.answer) {
          score++;
          $("feedback").textContent = `✅ Correct! ${q.joke}`;
          $("feedback").classList.add("ok");
        } else {
          buttons[i].classList.add("wrong");
          $("feedback").textContent = `❌ Wrong! The answer is ${q.options[q.answer]}. ${q.joke}`;
          $("feedback").classList.add("bad");
        }
      }
      $("score").textContent = `Score: ${score}`;
      $("next").textContent = current === questions.length - 1 ? "See result" : "Next question";
      $("next").classList.remove("hidden");
      $("next").focus();
    }

    function showResult() {
      $("quiz").classList.add("hidden");
      $("result").classList.remove("hidden");
      $("final-score").textContent = `${score} / ${questions.length}`;
      let msg;
      if (score === questions.length) msg = "Perfect! You are 100% chronically on MediaTok. Please go outside.";
      else if (score >= 7) msg = "Great! You have definitely typed 'Berserk' in a comment section.";
      else if (score >= 4) msg = "Mid. Subaru has died fewer times than you have lost questions.";
      else msg = "Return by Death activated. Go read some manga and try again.";
      $("final-message").textContent = msg;
    }

    $("next").addEventListener("click", () => {
      current++;
      if (current < questions.length) showQuestion();
      else showResult();
    });

    $("restart").addEventListener("click", () => {
      $("result").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      startRound();
    });

    startRound();
  </script>
</body>
</html>
