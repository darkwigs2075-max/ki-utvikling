<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaTok Quiz</title>
  <style>
    :root {
      --bg: #0e0e12;
      --card: #1a1a22;
      --text: #f2f2f5;
      --muted: #9a9aab;
      --accent: #ff2d6f;
      --ok: #1fb86a;
      --bad: #e5484d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a1030 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
    h1 span { color: var(--accent); }
    header p { margin: 6px 0 0; color: var(--muted); }
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }
    .status {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 8px;
    }
    .bar { height: 6px; background: #2c2c38; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .bar div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    h2 { font-size: 1.3rem; margin: 0 0 18px; line-height: 1.35; }
    .options { display: grid; gap: 10px; }
    .option {
      text-align: left;
      font: inherit;
      color: var(--text);
      background: #252531;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .option:hover:not(:disabled) { background: #30303f; }
    .option:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .option:disabled { cursor: default; }
    .option.correct { background: rgba(31, 184, 106, .2); border-color: var(--ok); }
    .option.wrong { background: rgba(229, 72, 77, .2); border-color: var(--bad); }
    .feedback { min-height: 1.6em; margin: 16px 0 0; font-weight: 600; }
    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }
    .btn {
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn:hover { filter: brightness(1.1); }
    .hidden { display: none; }
    #result { text-align: center; }
    #result .score { font-size: 3rem; font-weight: 800; color: var(--accent); margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Media<span>Tok</span> Quiz</h1>
    <p>Which anime &amp; manga are the greatest media of all time? Test your knowledge.</p>
  </header>

  <main class="card">
    <section id="quiz">
      <div class="status">
        <span id="progress"></span>
        <span id="score"></span>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <h2 id="question"></h2>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="btn hidden" id="next" type="button">Next question</button>
    </section>

    <section id="result" class="hidden">
      <h2>Quiz complete!</h2>
      <div class="score" id="final-score"></div>
      <p id="final-message"></p>
      <button class="btn" id="restart" type="button">Play again</button>
    </section>
  </main>

  <script>
    const QUESTIONS_PER_ROUND = 10;
    const pool = [
      {
        question: "Who is the flute-wielding young magi protagonist of Magi: The Labyrinth of Magic?",
        options: ["Alibaba Saluja", "Aladdin", "Judar", "Sinbad", "Hakuryuu"],
        answer: 1
      },
      {
        question: "Who wrote and illustrated the manga Magi: The Labyrinth of Magic?",
        options: ["Shinobu Ohtaka", "Tappei Nagatsuki", "Hiro Mashima", "Rifujin na Magonote"],
        answer: 0
      },
      {
        question: "What is the name of the protagonist of Mushoku Tensei: Jobless Reincarnation?",
        options: ["Subaru Natsuki", "Rudeus Greyrat", "Kazuma Satou", "Eren Yeager", "Orsted"],
        answer: 1
      },
      {
        question: "Who is Rudeus's first magic teacher in Mushoku Tensei?",
        options: ["Eris", "Sylphiette", "Roxy Migurdia", "Ghislaine"],
        answer: 2
      },
      {
        question: "What is Subaru Natsuki's special ability in Re:Zero?",
        options: ["Geass", "Time Stop", "Return by Death", "Nen", "Haki"],
        answer: 2
      },
      {
        question: "Which silver-haired half-elf does Subaru meet when he is summoned to another world in Re:Zero?",
        options: ["Rem", "Emilia", "Beatrice", "Priscilla"],
        answer: 1
      }
    ];

    const questions = [];

    const baseQuestions = [
      {
        question: "Who created the dark fantasy manga Berserk?",
        options: ["Hirohiko Araki", "Kentaro Miura", "Makoto Yukimura", "Eiichiro Oda"],
        answer: 1
      },
      {
        question: "What is the name of Guts's giant sword in Berserk?",
        options: ["Excalibur", "Masamune", "Zanpakuto", "Dragonslayer", "Muramasa"],
        answer: 3
      },
      {
        question: "Who is the author of JoJo's Bizarre Adventure?",
        options: ["Hirohiko Araki", "Naoki Urasawa", "Tite Kubo", "Kentaro Miura"],
        answer: 0
      },
      {
        question: "Which JoJo villain wields the Stand \"The World\"?",
        options: ["Kira Yoshikage", "Kars", "Diavolo", "DIO", "Pucci"],
        answer: 3
      },
      {
        question: "Who is the main protagonist of Vinland Saga?",
        options: ["Askeladd", "Canute", "Thorfinn", "Thorkell"],
        answer: 2
      },
      {
        question: "Which studio animated Vinland Saga Season 2?",
        options: ["Ufotable", "Bones", "Madhouse", "Wit Studio", "MAPPA"],
        answer: 4
      },
      {
        question: "Who wrote and drew the manga Attack on Titan?",
        options: ["Hajime Isayama", "Tsugumi Ohba", "Kohei Horikoshi", "Gege Akutami"],
        answer: 0
      },
      {
        question: "What is Monkey D. Luffy's dream in One Piece?",
        options: ["Become Hokage", "Become the Pirate King", "Defeat all Titans", "Become the strongest swordsman", "Find the Dragon Balls"],
        answer: 1
      },
      {
        question: "Who is Light Yagami's genius rival in Death Note?",
        options: ["Near", "Ryuk", "L", "Mello"],
        answer: 2
      },
      {
        question: "What is MediaTok best known for?",
        options: [
          "Fans arguing which anime or manga is the greatest media ever made",
          "Cooking tutorials",
          "Dance challenges to pop songs",
          "Cryptocurrency advice"
        ],
        answer: 0
      }
    ];
    pool.push(...baseQuestions);

    function startRound() {
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      questions.length = 0;
      questions.push(...shuffled.slice(0, QUESTIONS_PER_ROUND));
      current = 0;
      score = 0;
      showQuestion();
    }

    const $ = (id) => document.getElementById(id);
    let current = 0;
    let score = 0;
    let answered = false;

    function showQuestion() {
      const q = questions[current];
      answered = false;
      $("progress").textContent = `Question ${current + 1}/${questions.length}`;
      $("score").textContent = `Score: ${score}`;
      $("bar").style.width = `${(current / questions.length) * 100}%`;
      $("question").textContent = q.question;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("next").classList.add("hidden");

      const box = $("options");
      box.innerHTML = "";
      q.options.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = text;
        btn.addEventListener("click", () => choose(i));
        box.appendChild(btn);
      });
    }

    function choose(i) {
      if (answered) return;
      answered = true;
      const q = questions[current];
      const buttons = $("options").children;
      for (const b of buttons) b.disabled = true;
      buttons[q.answer].classList.add("correct");

      if (i === q.answer) {
        score++;
        $("feedback").textContent = "✅ Correct!";
        $("feedback").classList.add("ok");
      } else {
        buttons[i].classList.add("wrong");
        $("feedback").textContent = `❌ Wrong! The correct answer is: ${q.options[q.answer]}`;
        $("feedback").classList.add("bad");
      }
      $("score").textContent = `Score: ${score}`;
      $("next").textContent = current === questions.length - 1 ? "See result" : "Next question";
      $("next").classList.remove("hidden");
      $("next").focus();
    }

    function showResult() {
      $("quiz").classList.add("hidden");
      $("result").classList.remove("hidden");
      $("final-score").textContent = `${score} / ${questions.length}`;
      let msg;
      if (score === questions.length) msg = "Perfect! You are a true MediaTok legend.";
      else if (score >= 7) msg = "Great job! You clearly spend time on MediaTok.";
      else if (score >= 4) msg = "Not bad! Time to add a few more series to your watch list.";
      else msg = "Touch grass... or rather, go read some manga!";
      $("final-message").textContent = msg;
    }

    $("next").addEventListener("click", () => {
      current++;
      if (current < questions.length) showQuestion();
      else showResult();
    });

    $("restart").addEventListener("click", () => {
      $("result").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      startRound();
    });

    startRound();
  </script>
</body>
</html>
