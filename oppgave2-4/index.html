<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABA Quiz - Anime Battle Arena</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef1f7;
      color: #1b2233;
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }
    .wrap { width: 100%; max-width: 760px; }
    header { text-align: center; margin-bottom: 18px; }
    header h1 { margin: 0; font-size: 2rem; }
    header p { margin: 4px 0 0; color: #5a6480; }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(20, 30, 60, .12);
    }
    .meta { display: flex; justify-content: space-between; font-weight: 600; color: #5a6480; margin-bottom: 8px; }
    .progress { height: 8px; background: #e3e7f1; border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
    .progress div { height: 100%; width: 0; background: #3b6cf6; transition: width .3s; }
    h2 { margin: 0 0 18px; font-size: 1.4rem; line-height: 1.35; }
    .options { display: grid; gap: 10px; }
    .options.chars { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .option {
      font: inherit;
      text-align: left;
      padding: 14px 16px;
      border: 2px solid #d5dbea;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .option:hover:not(:disabled) { border-color: #3b6cf6; background: #f3f6ff; }
    .option:disabled { cursor: default; }
    .option.correct { border-color: #1f9d55; background: #e5f7ec; }
    .option.wrong { border-color: #d64545; background: #fdeaea; }
    .chars .option { text-align: center; padding: 10px; }
    .portrait {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      background: #dfe5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 700;
      color: #7d8aad;
      object-fit: cover;
      object-position: top;
      margin-bottom: 8px;
    }
    .name { font-weight: 600; }
    .feedback { min-height: 1.6em; margin: 16px 0 0; font-weight: 700; }
    .feedback.ok { color: #1f9d55; }
    .feedback.bad { color: #d64545; }
    .btn {
      font: inherit;
      font-weight: 700;
      margin-top: 14px;
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #3b6cf6;
      color: #fff;
      cursor: pointer;
    }
    .btn:hover { background: #2d58d4; }
    .hidden { display: none; }
    #result { text-align: center; }
    .big { font-size: 3rem; font-weight: 800; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ABA Quiz</h1>
      <p>How well do you know Anime Battle Arena?</p>
    </header>

    <div class="card" id="quiz">
      <div class="meta"><span id="progress"></span><span id="score"></span></div>
      <div class="progress"><div id="bar"></div></div>
      <h2 id="question"></h2>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <button class="btn hidden" id="next" type="button">Next</button>
    </div>

    <div class="card hidden" id="result">
      <p>Your result</p>
      <div class="big" id="final-score"></div>
      <h2 id="title"></h2>
      <p id="final-message"></p>
      <button class="btn" id="restart" type="button">Play again</button>
    </div>
  </div>

  <script>
    const QUESTIONS_PER_ROUND = 10;
    const questions = [];

    // The first option is always the correct one (options are shuffled on load).
    // chars: true shows the options as character portraits.
    const pool = [
      { question: "Who's the humble Z tier? The tier list gave up on him halfway through typing the letter.", chars: true,
        options: ["Yoruichi", "Might Guy", "Akainu", "Lancer", "Bam"] },
      { question: "Might Guy, Akainu, Lancer, Bam and Yoruichi all queue up. Which one finishes the game with 0 kills and still says 'my team diffed'?", chars: true,
        options: ["Yoruichi", "Might Guy", "Akainu", "Lancer", "Bam"] },
      { question: "Whose tier list placement is just a cry for help? SS, S, A, B, C... and then Z.", chars: true,
        options: ["Yoruichi", "Might Guy", "Akainu", "Lancer", "Bam"] },
      { question: "Who's the humble C tier? He gets blamed for every loss, but 'the main is fine, I'm just bad'.", chars: true,
        options: ["Piccolo", "Gaara", "Enel", "Trafalgar Law", "Tanjiro Kamado"] },
      { question: "Humble C tier: who gets picked last in every lobby, then types 'gg ez' anyway?", chars: true,
        options: ["Enel", "Piccolo", "Gaara", "Trafalgar Law", "Sukuna"] },
      { question: "Humble C tier: who is so mid that even the tier list forgot to argue about him?", chars: true,
        options: ["Gaara", "Enel", "Piccolo", "Tanjiro Kamado", "Sukuna"] },
      { question: "You queue Ranked 'just for fun'. Three losses later, what has happened to you?",
        options: ["You are now a tier list expert", "You are calm", "You touched grass", "You are at peace"] },
      { question: "After losing a 1v1, someone in chat types 'it was just lag'. What is the real tier of that player?",
        options: ["Humble Z tier", "SS tier", "God tier", "A tier"] },
              { question: "The council has spoken and the friend group tier list is final. Who sits alone at the top of S tier while everyone else copes?",
                options: ["Legacy", "Himsagi", "Jay", "Mousa", "Goddid"] },
              { question: "Legacy is the S tier king. Who is the other S tier player that gets 'close' and still posts a 4-paragraph excuse in chat?",
                options: ["Himsagi", "Jay", "Mousa", "Goddid", "Bapte"] },
              { question: "Legacy and Himsagi are S tier. Who is the third S tier member who runs to the podium and still says he was 'robbed'?",
                options: ["Jay", "Mousa", "Goddid", "Bloodel", "Hudeyfkiller47"] },
              { question: "Who is the GOAT of ABA? Warning: wrong answers get you muted and a free 'skill issue' in chat.",
                options: ["Legacy", "Himsagi", "Jay", "Mousa", "Goddid"] },
              { question: "Who is A tier by the tier list's generosity: refuses to M1 trade, runs around like a dork, and picks the cheapest character so his slow brain can keep up?",
                options: ["Mousa", "Jay", "Himsagi", "Legacy", "Goddid"] },
              { question: "Who climbed into A tier by beating the fraudulent Bloodel, and has not shut up about it since?",
                options: ["Goddid", "Mousa", "Bapte", "Hudeyfkiller47", "Jay"] },
              { question: "Who says 'wallahi I'm never touching ABA again', logs on the next morning, and swears 'I never said that, it was a partial break'?",
                options: ["Bloodel", "Legacy", "Himsagi", "Jay", "Goddid"] },
              { question: "Who is a certified fraud with a tier list ranking he absolutely did not earn?",
                options: ["Bloodel", "Goddid", "Bapte", "Hudeyfkiller47", "Mousa"] },
              { question: "Who bets everything on a wager against the S tier guys, loses every single time, lands in B tier (the shit tier), and says 'one more'?",
                options: ["Bapte", "Legacy", "Himsagi", "Jay", "Mousa"] },
              { question: "Who is the B tier (shit tier) punching bag? Everyone logs on, sees his name, and queues him on purpose.",
                options: ["Bapte", "Bloodel", "Goddid", "Hudeyfkiller47", "Mousa"] },
              { question: "Who is at the very bottom of the B tier (shit tier) and still pretends it's 'strategic'?",
                options: ["Hudeyfkiller47", "Bapte", "Bloodel", "Goddid", "Legacy"] },
              { question: "Who's the biggest fraud in ABA? Choose wisely, the lobby is watching.", chars: true,
                options: ["Bloodel", "Garp", "Akainu", "Legacy"] },
              { question: "Ilyas has not been placed on the friend group tier list yet. Which tier is he in?",
                options: ["Unranked", "S tier", "A tier", "B tier", "B tier (shit tier)"] },
    ];

    const finalQuestion = {
      question: "FINAL BOSS: who is the best character in ABA?", chars: true,
      options: ["Gojo", "Kakashi", "Ichigo", "Shanks", "Yuji Itadori"],
      allCorrect: true
    };

    // Search terms used to look up portraits on AniList when the display name is ambiguous.
    const SEARCH = {
      "Yoruichi": "Yoruichi Shihouin", "Might Guy": "Might Guy", "Akainu": "Sakazuki",
      "Lancer": "Cu Chulainn", "Bam": "Twenty-Fifth Bam", "Gojo": "Satoru Gojo",
      "Kakashi": "Kakashi Hatake", "Ichigo": "Ichigo Kurosaki", "Shanks": "Shanks",
      "Yuji Itadori": "Yuji Itadori", "Tanjiro Kamado": "Tanjiro Kamado", "Garp": "Garp"
    };
    // Real people have no portrait to look up, so they get an initial instead.
    const NO_PORTRAIT = ["Ilyas", "Jay", "Bloodel", "Hudeyfkiller47", "Bapte", "Mousa", "Himsagi", "Legacy", "Goddid"];
    const IMG_KEY = "aba-images";
    let images = {};
    try { images = JSON.parse(localStorage.getItem(IMG_KEY)) || {}; } catch (e) {}

    const SEEN_KEY = "aba-seen";
    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const $ = (id) => document.getElementById(id);
    let current = 0;
    let score = 0;
    let answered = false;

    function prepare(q) {
      const options = shuffle(q.options.map((text, i) => ({ text, correct: i === 0 })));
      return { ...q, options: options.map((o) => o.text), answer: options.findIndex((o) => o.correct) };
    }

    function pickQuestions(count) {
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) {}
      let fresh = pool.filter((q) => !seen.includes(q.question));
      if (fresh.length < count) {
        seen = [];
        fresh = pool;
      }
      const picked = shuffle(fresh).slice(0, count);
      try {
        localStorage.setItem(SEEN_KEY, JSON.stringify(seen.concat(picked.map((q) => q.question))));
      } catch (e) {}
      return picked.map(prepare);
    }

    async function loadImages(names) {
      const missing = names.filter((n) => !images[n] && !NO_PORTRAIT.includes(n));
      if (!missing.length) return;
      // One request per character, so a single failed lookup does not drop the other portraits.
      await Promise.all(missing.map(async (n) => {
        const query = `{Character(search:${JSON.stringify(SEARCH[n] || n)}){image{large}}}`;
        try {
          const res = await fetch("https://graphql.anilist.co", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query })
          });
          const data = (await res.json()).data;
          const url = data && data.Character && data.Character.image && data.Character.image.large;
          if (url) images[n] = url;
        } catch (e) {}
      }));
      try { localStorage.setItem(IMG_KEY, JSON.stringify(images)); } catch (e) {}
    }

    function portrait(name) {
      if (images[name]) {
        const img = document.createElement("img");
        img.className = "portrait";
        img.src = images[name];
        img.alt = name;
        img.referrerPolicy = "no-referrer";
        return img;
      }
      const div = document.createElement("div");
      div.className = "portrait";
      div.textContent = name[0];
      return div;
    }

    function startRound() {
      questions.length = 0;
      questions.push(...pickQuestions(QUESTIONS_PER_ROUND - 1), prepare(finalQuestion));
      questions[questions.length - 1].answer = 0;
      current = 0;
      score = 0;
      showQuestion();
    }

    async function showQuestion() {
      const q = questions[current];
      answered = false;
      $("progress").textContent = `Question ${current + 1}/${questions.length}`;
      $("score").textContent = `Score: ${score}`;
      $("bar").style.width = `${(current / questions.length) * 100}%`;
      $("question").textContent = q.question;
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("next").classList.add("hidden");
      if (q.chars) await loadImages(q.options);
      if (questions[current] !== q) return;
      renderOptions(q);
    }

    function renderOptions(q) {
      const box = $("options");
      box.innerHTML = "";
      box.className = q.chars ? "options chars" : "options";
      q.options.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        if (q.chars) {
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = text;
          btn.append(portrait(text), name);
        } else {
          btn.textContent = text;
        }
        btn.addEventListener("click", () => choose(i));
        box.appendChild(btn);
      });
    }

    function choose(i) {
      if (answered) return;
      answered = true;
      const q = questions[current];
      const buttons = $("options").children;
      for (const b of buttons) b.disabled = true;

      if (q.allCorrect) {
        for (const b of buttons) b.classList.add("correct");
        score++;
        $("feedback").textContent = "✅ Every answer is correct. Do not argue.";
        $("feedback").classList.add("ok");
      } else {
        buttons[q.answer].classList.add("correct");
        if (i === q.answer) {
          score++;
          $("feedback").textContent = "✅ Correct!";
          $("feedback").classList.add("ok");
        } else {
          buttons[i].classList.add("wrong");
          $("feedback").textContent = `❌ Wrong! The answer is: ${q.options[q.answer]}`;
          $("feedback").classList.add("bad");
        }
      }
      $("score").textContent = `Score: ${score}`;
      $("next").textContent = current === questions.length - 1 ? "See result" : "Next question";
      $("next").classList.remove("hidden");
      $("next").focus();
    }

    function showResult() {
      $("quiz").classList.add("hidden");
      $("result").classList.remove("hidden");
      $("final-score").textContent = `${score} / ${questions.length}`;
      let title, msg;
      if (score === questions.length) {
        title = "Ranked Legend";
        msg = "Perfect. You are chronically online in ABA. Please go outside.";
      } else if (score >= 7) {
        title = "Certified Lobby Warrior";
        msg = "You have definitely typed 'it was just lag' after a loss.";
      } else if (score >= 4) {
        title = "Casual Arena Enjoyer";
        msg = "Mid, but with potential. Learn your dodge key.";
      } else {
        title = "NPC in Training";
        msg = "You got comboed for 40 seconds. Press F to block, then queue again.";
      }
      $("title").textContent = title;
      $("final-message").textContent = msg;
    }

    $("next").addEventListener("click", () => {
      current++;
      if (current < questions.length) showQuestion();
      else showResult();
    });

    $("restart").addEventListener("click", () => {
      $("result").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      startRound();
    });

    startRound();
  </script>
</body>
</html>
